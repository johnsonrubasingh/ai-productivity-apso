name: APSO CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend tests and static readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "apps/backend[dev]"

      - name: Static production readiness checks
        run: python scripts/quality/production_readiness_check.py

      - name: Backend tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: apps/backend/src
        run: python -m pytest apps/backend/tests

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend
        run: corepack pnpm install --frozen-lockfile

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Build
        run: corepack pnpm build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Semgrep CE
        uses: semgrep/semgrep-action@v1
        env:
          SEMGREP_SEND_METRICS: "off"
        with:
          config: .semgrep.yml

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          skip-dirs: apps/frontend/.next,apps/frontend/node_modules,runtime,rendered_apso_plan

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: APSO
          path: apps/frontend/package.json
          format: HTML
          args: >
            --scan apps/backend/pyproject.toml
            --scan apps/frontend/pnpm-lock.yaml
            --failOnCVSS 7
            --suppression dependency-check-suppression.xml
            --disableYarnAudit
            --disablePnpmAudit

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports
